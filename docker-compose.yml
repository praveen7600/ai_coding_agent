version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-coding-agent-postgres
    environment:
      POSTGRES_DB: ai_coding_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
